<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asy Dhaif — Contact</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="contact-main">
    <section class="contact-page">
      <div class="contact-glow contact-glow-1"></div>
      <div class="contact-glow contact-glow-2"></div>
      <div class="contact-glow contact-glow-3"></div>

      <h1 class="contact-headline">
        <span class="reveal-line-wrap"><span class="reveal-line">Planning a</span></span>
        <span class="reveal-line-wrap"><span class="reveal-line reveal-delay-1">show?</span></span>
      </h1>

      <div class="contact-card reveal-delay-2">
        <h2 class="contact-card-title">Get in touch</h2>
        <p class="contact-card-subtitle">Tell me about your event, venue, or idea — I'll get back to you soon.</p>

        <form id="contact-form" class="contact-form">
          <input type="hidden" name="_subject" value="New message from iasy.site">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="false">
          <input type="text" name="_honey" class="form-honeypot" tabindex="-1" autocomplete="off">

          <div class="form-field">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name" required>
          </div>

          <div class="form-field">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" required>
          </div>

          <div class="form-field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
          </div>

          <button type="submit" class="contact-submit">
            <span class="btn-label">Send Message</span>
          </button>

          <p class="contact-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/contact-form.js"></script>
</body>
</html>
