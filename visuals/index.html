<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asy Dhaif — Visuals</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="split-slider-main">
    <section class="split-slider" id="split-slider">
      <div class="split-slider-media">
        <div class="split-slide-image is-active" data-title="Pebblebed" data-meta="AI Conference · 2023 · Projection Mapping and Animation" style="background-image: url('/assets/images/visuals/pebblebed-ai-conference-2023.png');"></div>
        <div class="split-slide-image" data-title="PoloCorp" data-meta="Public Works · 2025 · Projection Mapping and Animation" style="background-image: url('/assets/images/visuals/polocorp-public-works-2025.jpg');"></div>
        <div class="split-slide-image" data-title="PlayAlchemist" data-meta="Burning Man · 2022 · Projection Mapping and Animation" style="background-image: url('/assets/images/visuals/playalchemist-burning-man-2022.jpg');"></div>
        <div class="split-slide-image" data-title="251 Club" data-meta="San Francisco · 2019 · Live Visuals" style="background-image: url('/assets/images/visuals/251-club-san-francisco-2019.jpg');"></div>
        <div class="split-slide-image" data-title="Chillits Festival" data-meta="Laytonville, California · 2022 · Live VJ Set + Projection Mapping" style="background-image: url('/assets/images/visuals/chillits-festival-2022.jpg');"></div>
        <div class="split-slide-image" data-title="SpaceX" data-meta="IPO Event · 2026 · Animations" style="background-image: url('/assets/images/visuals/spacex-ipo-event-2026.jpg');"></div>
        <div class="split-slide-image" data-title="Gray Area" data-meta="San Francisco · 2026 · Animation &amp; Projection Mapping Design" style="background-image: url('/assets/images/visuals/gray-area-san-francisco-2026.jpg');"></div>
        <div class="split-slider-scrim"></div>

        <div class="split-slider-dots">
          <button class="split-dot is-active" data-index="0" style="background-image: url('/assets/images/visuals/pebblebed-ai-conference-2023.png');" aria-label="Pebblebed"></button>
          <button class="split-dot" data-index="1" style="background-image: url('/assets/images/visuals/polocorp-public-works-2025.jpg');" aria-label="PoloCorp"></button>
          <button class="split-dot" data-index="2" style="background-image: url('/assets/images/visuals/playalchemist-burning-man-2022.jpg');" aria-label="PlayAlchemist"></button>
          <button class="split-dot" data-index="3" style="background-image: url('/assets/images/visuals/251-club-san-francisco-2019.jpg');" aria-label="251 Club"></button>
          <button class="split-dot" data-index="4" style="background-image: url('/assets/images/visuals/chillits-festival-2022.jpg');" aria-label="Chillits Festival"></button>
          <button class="split-dot" data-index="5" style="background-image: url('/assets/images/visuals/spacex-ipo-event-2026.jpg');" aria-label="SpaceX"></button>
          <button class="split-dot" data-index="6" style="background-image: url('/assets/images/visuals/gray-area-san-francisco-2026.jpg');" aria-label="Gray Area"></button>
        </div>
      </div>

      <div class="split-slider-panel">
        <p class="split-slider-eyebrow">Visuals</p>

        <div class="split-slider-index">
          <span class="current">01</span>
          <span class="index-slash"></span>
          <span class="total">07</span>
        </div>

        <h1 class="split-slider-title">Pebblebed</h1>
        <p class="split-slider-meta">AI Conference · 2023 · Projection Mapping and Animation</p>

        <div class="split-slider-nav">
          <button class="split-nav-btn" data-dir="prev" aria-label="Previous">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3 8l5-5 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="split-nav-btn" data-dir="next" aria-label="Next">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/split-slider.js"></script>
</body>
</html>
